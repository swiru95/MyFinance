name: Tests

# Runs on pull requests, and is called by build-images.yml so no image is
# pushed from a commit whose tests fail.
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/test.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # pdftotext: the PDF report tests read the generated PDF back as text.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pip install -r requirements-dev.txt
      # test_demo_wallet_round_trip fails on main (income differs after a
      # wallet export/import); tracked separately, remove this deselect
      # with the fix.
      - run: >-
          python -m pytest -q -p no:cacheprovider
          --deselect tests/test_wallet_io.py::test_demo_wallet_round_trip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'       # matches frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit --incremental false
      - run: npm run check:import
      - run: npm run build
