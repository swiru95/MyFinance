services:
  backend:
    build: ./backend
    container_name: myfinance-backend
    restart: unless-stopped
    # The API does not create tables at startup (a separate schema job does that on Kubernetes), so on a fresh volume
    # every request failed with 500. Run the job first; it is idempotent and only migrates what is missing.
    command: sh -c "python -m src.schema && exec uvicorn src.main:app --host 0.0.0.0 --port 8000"
    environment:
      - MYFINANCE_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      # Entra ID SSO. Leave both unset and the API is open and the frontend
      # skips the sign-in screen entirely - which is what you want locally, and
      # is why compose does not hardcode them. Export them in your shell to
      # exercise the real flow; the app registration needs
      # http://localhost:3000 as an SPA redirect URI for that to work.
      - MYFINANCE_AUTH_TENANT_ID=${MYFINANCE_AUTH_TENANT_ID:-}
      - MYFINANCE_AUTH_CLIENT_ID=${MYFINANCE_AUTH_CLIENT_ID:-}
      - MYFINANCE_AUTH_REQUIRED_ROLE=${MYFINANCE_AUTH_REQUIRED_ROLE:-MyFinance.User}
      # Wallet assessment. Taken from your shell so the key is never written
      # into this file; leave them unset and the Report page reports itself
      # unconfigured instead of failing. See README "Wallet assessment".
      - MYFINANCE_LLM_BASE_URL=${MYFINANCE_LLM_BASE_URL:-}
      - MYFINANCE_LLM_API_KEY=${MYFINANCE_LLM_API_KEY:-}
      - MYFINANCE_LLM_MODEL=${MYFINANCE_LLM_MODEL:-Thinker}
      - MYFINANCE_LLM_TRANSLATE_MODEL=${MYFINANCE_LLM_TRANSLATE_MODEL:-Bielik}
      # Statement import, "on this server" mode (README "Statement import").
      - MYFINANCE_LLM_IMPORT_MODEL=${MYFINANCE_LLM_IMPORT_MODEL:-Bielik}
      - MYFINANCE_LLM_VERIFY_TLS=${MYFINANCE_LLM_VERIFY_TLS:-false}
    volumes:
      - myfinance-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: myfinance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  myfinance-data:
